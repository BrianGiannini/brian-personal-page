<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Brian Giannini</title>
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/scripts/theme-flash-prevention.js"></script>
    <style>
        .not-found {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            gap: 1rem;
        }
        .not-found-code {
            font-family: var(--font-heading);
            font-size: clamp(4rem, 12vw, 7rem);
            font-weight: 800;
            line-height: 1;
            color: var(--color-primary);
        }
        .not-found p {
            color: var(--color-text-muted);
            max-width: 420px;
        }
        .not-found-btn {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-full);
            background: var(--color-primary);
            color: #fff;
            font-weight: 700;
            transition: transform var(--transition-fast), background var(--transition-fast);
        }
        .not-found-btn:hover {
            transform: translateY(-2px);
            background: var(--color-accent);
        }
    </style>
</head>

<body>
    <div class="background-glob" aria-hidden="true"></div>
    <main class="not-found">
        <div class="not-found-code">404</div>
        <h1>Page not found</h1>
        <p>The page you are looking for does not exist or has moved.</p>
        <a href="/" class="not-found-btn">Back to briangiannini.com</a>
    </main>
</body>

</html>
