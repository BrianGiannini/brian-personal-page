<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Collab AI TV: a TV whose picture is generated, steered by viewers' chat messages -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="0.55" stop-color="#3498db"/>
      <stop offset="1" stop-color="#00cec9"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <path d="M168 34 L200 58 L232 34" fill="none" stroke="#2c3e50" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- TV body and screen -->
  <rect x="112" y="58" width="176" height="118" rx="18" fill="#2c3e50"/>
  <rect x="124" y="70" width="152" height="94" rx="10" fill="url(#screen)"/>
  <!-- Generation sparkle -->
  <path d="M200 88 C203 106 206 109 224 112 C206 115 203 118 200 136 C197 118 194 115 176 112 C194 109 197 106 200 88 Z" fill="#ffffff"/>
  <path d="M236 82 C237 89 238 90 245 91 C238 92 237 93 236 100 C235 93 234 92 227 91 C234 90 235 89 236 82 Z" fill="#ffffff" opacity="0.85"/>
  <!-- Viewers' chat bubbles -->
  <g>
    <rect x="30" y="74" width="62" height="34" rx="10" fill="#6c5ce7"/>
    <path d="M78 106 L90 118 L66 106 Z" fill="#6c5ce7"/>
    <rect x="42" y="86" width="38" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="42" y="95" width="24" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
  </g>
  <g>
    <rect x="308" y="112" width="62" height="34" rx="10" fill="#00b5b0"/>
    <path d="M322 144 L310 156 L334 144 Z" fill="#00b5b0"/>
    <rect x="320" y="124" width="38" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="320" y="133" width="24" height="5" rx="2.5" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Stand -->
  <rect x="176" y="176" width="48" height="8" rx="4" fill="#2c3e50"/>
</svg>
